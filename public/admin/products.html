<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Products — Ayush Creation Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
        <rect width="52" height="52" rx="10" fill="#0A1628"/>
        <text x="26" y="34" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#C9942A" text-anchor="middle">AC</text>
      </svg>
      <div>
        <div class="sidebar-brand-title">Ayush Creation</div>
        <div class="sidebar-brand-subtitle">Admin Control</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-heading">Main</div>
      <a href="index.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="enquiries.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/></svg>
        <span>Enquiries & Leads</span>
      </a>

      <div class="nav-heading">Catalog</div>
      <a href="products.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg>
        <span>Products</span>
      </a>
      <a href="categories.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
        <span>Categories</span>
      </a>
      <a href="gallery.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>Gallery & Facility</span>
      </a>

      <div class="nav-heading">System</div>
      <a href="settings.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Company Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="admin-user-info">
        <span id="adminUserName" class="admin-user-name">Admin</span>
        <span class="admin-user-role">Administrator</span>
      </div>
      <button id="logoutBtn" class="btn-logout">Logout</button>
    </div>
  </aside>

  <!-- Main Container -->
  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-header-title">
        <h1>Product Catalog Management</h1>
      </div>
      <div class="admin-header-actions">
        <a href="product-form.html" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Product
        </a>
      </div>
    </header>

    <div class="admin-content">
      <!-- Search & Filters -->
      <div class="admin-panel" style="margin-bottom: 20px;">
        <div class="panel-body" style="padding: 16px 20px;">
          <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:center;">
            <div style="flex:1; min-width:200px;">
              <input type="text" id="productSearchInput" class="form-control" placeholder="Search product name..." />
            </div>
            <div style="width:180px;">
              <select id="productStatusFilter" class="form-control">
                <option value="">All Statuses</option>
                <option value="published">Published</option>
                <option value="draft">Draft</option>
              </select>
            </div>
            <button onclick="loadProducts()" class="btn btn-primary">Filter</button>
          </div>
        </div>
      </div>

      <!-- Products Table -->
      <div class="admin-panel">
        <div class="panel-header">
          <h2 class="panel-title" id="productCountTitle">Products</h2>
        </div>
        <div class="panel-body" style="padding:0;">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="width:70px;">Image</th>
                  <th>Product Name</th>
                  <th>Category</th>
                  <th>Status</th>
                  <th>Featured</th>
                  <th>Sort</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="productsTableBody">
                <tr><td colspan="8" style="text-align:center; padding:32px;">Loading products...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="admin.js"></script>
  <script>
    async function loadProducts() {
      const search = document.getElementById('productSearchInput').value.trim();
      const status = document.getElementById('productStatusFilter').value;

      let q = '?limit=50';
      if (search) q += `&search=${encodeURIComponent(search)}`;
      if (status) q += `&status=${encodeURIComponent(status)}`;

      try {
        const res = await adminFetch(`/admin/products/admin/list${q}`);
        const products = res.data;
        document.getElementById('productCountTitle').textContent = `Total Products: ${res.meta.total}`;

        const tbody = document.getElementById('productsTableBody');
        if (products.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:32px; color:#64748B;">No products found in database. Click "Add Product" to create your first product.</td></tr>';
          return;
        }

        tbody.innerHTML = products.map(p => {
          const thumb = (p.images && p.images[0] && p.images[0].url) || '../images/product-school-shirts.jpg';
          return `
            <tr>
              <td>
                <img src="${thumb}" alt="${p.name}" style="width:50px; height:50px; object-fit:cover; border-radius:6px; border:1px solid #E2E8F0;" />
              </td>
              <td>
                <strong>${p.name}</strong><br>
                <span style="font-size:0.75rem; color:#64748B;">slug: ${p.slug}</span>
              </td>
              <td>${p.category ? p.category.name : 'Uncategorized'}</td>
              <td>${getStatusBadge(p.status)}</td>
              <td>${p.featured ? '<span style="color:#C9942A; font-weight:700;">★ Featured</span>' : '<span style="color:#94A3B8;">—</span>'}</td>
              <td>${p.sortOrder || 0}</td>
              <td>${formatDate(p.createdAt)}</td>
              <td>
                <div style="display:flex; gap:6px;">
                  <a href="product-form.html?id=${p._id}" class="btn btn-sm btn-secondary">Edit</a>
                  <button onclick="deleteProduct('${p._id}', '${p.name.replace(/'/g, "\\'")}')" class="btn btn-sm btn-danger">Delete</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        showToast('Error loading products: ' + err.message, 'error');
      }
    }

    async function deleteProduct(id, name) {
      if (!confirm(`Are you sure you want to delete product "${name}"? This action cannot be undone.`)) {
        return;
      }

      try {
        await adminFetch(`/admin/products/admin/${id}`, { method: 'DELETE' });
        showToast(`Product "${name}" deleted successfully`, 'success');
        loadProducts();
      } catch (err) {
        showToast('Delete failed: ' + err.message, 'error');
      }
    }

    loadProducts();
  </script>
</body>
</html>
